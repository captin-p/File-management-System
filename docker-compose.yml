version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dmsuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_DEBUG=True
      - POSTGRES_DB=dms
      - POSTGRES_USER=dmsuser
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  worker:
    build: .
    command: python -m celery -A dms_project worker -l info
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_DEBUG=True
      - POSTGRES_DB=dms
      - POSTGRES_USER=dmsuser
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:
  postgres_data:
  media_data:
