version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dmsuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      - DJANGO_DEBUG=True
      - OCR_PROCESSING_MODE=background
      - POSTGRES_DB=dms
      - POSTGRES_USER=dmsuser
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
  worker:
    build: .
    command: python manage.py process_ocr_queue --loop
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      - db
    environment:
      - DJANGO_DEBUG=True
      - OCR_PROCESSING_MODE=background
      - POSTGRES_DB=dms
      - POSTGRES_USER=dmsuser
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
volumes:
  postgres_data:
  media_data:
