{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Delete document</h1>
                <p class="mb-4">Delete <strong>{{ document.title }}</strong>? This removes the database record and the stored file.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger">Delete</button>
                        <a class="btn btn-outline-secondary" href="{% url 'documents:document_detail' document.pk %}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
